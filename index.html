<head>

<title>시약 관리로 이동</title>
<script>
  // ▼ Apps Script 웹앱 배포 주소를 그대로 붙여 넣으세요 (끝이 /exec)
  const APP = 'https://script.google.com/a/macros/snu.ac.kr/s/AKfycbw9n_fgTJmiNsYsVfrulN79sT5y8HG4VPoxpEdjQ8LNgrvA4Z5CbvPSdSu2L3ECJU7b6w/exec';
  // HTTPS://WAGO97.GITHUB.IO/C00012 → APP?id=C00012
  const last = location.pathname.split('/').filter(Boolean).pop() || '';
  const id = decodeURIComponent(last).trim().toUpperCase();
  location.replace(/^C\d{3,8}$/.test(id) ? APP + '?id=' + id : APP);
</script>
</head>
<body style="font-family:sans-serif;padding:24px">
  <p>시약 관리 화면으로 이동하고 있습니다.</p>
